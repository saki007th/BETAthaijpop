<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Lyric Workspace</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/winbox.bundle.min.js"></script>
</head>
<body>
    <!-- 🔴 เลเยอร์ภาพพื้นหลัง -->
    <div id="desktop-wallpaper"></div>
    <div id="dynamic-bg"></div>

    <div id="loadingOverlay">
        <div>กำลังโหลดข้อมูลคลังเพลง...</div>
    </div>

   <!-- แถบ Dock -->
    <nav class="floating-pill-dock" id="mainDock">
        
      <!-- Live Activity -->
        <div id="liveActivity" class="live-activity hidden" title="เปิดหน้าต่างเครื่องเล่น">
            <div class="live-icon">🎵</div>
            <div class="live-info">
                <div id="liveTitle" class="live-title">-</div>
                <div id="liveArtist" class="live-artist">-</div>
            </div>
            
            <div class="live-controls" style="display: flex; gap: 5px; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 15px; margin-left: 10px;">
                <button id="btnLivePrev" class="live-btn" title="ก่อนหน้า">⏮</button>
                <button id="livePlayPauseBtn" class="live-btn" title="เล่น/พัก">⏸</button>
                <button id="btnLiveNext" class="live-btn" title="ถัดไป">⏭</button>
            </div>
        </div>

        <div id="dockDivider" class="dock-divider hidden"></div>

        <!-- เมนูหลัก -->
        <div class="dock-buttons">
            <button id="btnDockLibrary" class="pill-btn" title="คลังเพลง">🏠</button>
            <button id="btnDockSettings" class="pill-btn" title="ตั้งค่า">⚙️</button>
            <button id="btnDockPiP" class="pill-btn" style="color: #00d2ff;" title="PiP (หน้าต่างลอย)">🪟</button>
            
            <button id="btnDockAdminSync" class="pill-btn" style="display:none; color: #ffcc00;" title="ซิงค์ & จัดการเนื้อ">⏱</button>
            
            <button id="btnHeaderLogin" class="pill-btn" style="color: #34c759;" title="เข้าสู่ระบบแอดมิน">👤</button>
            <button id="btnHeaderLogout" class="pill-btn" style="display:none; color: #ff3b30;" title="ออกจากระบบ">🚪</button>
        </div>
    </nav>

    <!-- โกดังเก็บหน้าต่าง (Templates) -->
    <div id="window-warehouse" style="display: none;">
        
        <!-- 1. คลังเพลง -->
        <div id="content-library" class="wb-content-padding">
            <div class="library-toolbar">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 ค้นหาชื่อเพลง หรือ ศิลปิน...">
                <button id="btnAddSong" class="btn-primary" style="display: none;">✨ เพิ่มเพลง</button>
            </div>
            <div id="artistChips" class="artist-chips"></div>
            <div id="songList" class="song-grid"></div>
        </div>

        <!-- 2. วิดีโอ -->
        <div id="content-player" style="width: 100%; height: 100%; background: #000;">
            <div id="youtubePlayer" style="width: 100%; height: 100%;"></div>
        </div>

        <!-- 3. เนื้อเพลง -->
        <div id="content-lyrics" class="wb-content-padding">
            <div id="versionContainer" style="display: none;"></div>
            <div id="lyricsContainer" class="lyrics-container"></div>
        </div>
            
        <!-- 4. หน้าต่าง Admin -->
        <div id="content-admin-sync" class="wb-content-padding">
            <div class="sticky-sync-bar" id="lyricControlBtnGroup">
                <button id="btnSyncPrev" class="btn-secondary">⏮ ย้อน (ลบเวลา)</button>
                <button id="btnSyncNext" class="btn-primary" style="background: #ffcc00; color: #000;">⏭ ถัดไป (จับจังหวะ)</button>
            </div>
            <div id="timestampList" class="timestamp-list"></div>
            <button id="btnResetSync" class="btn-secondary" style="margin-top: 15px; width: 100%;">🔄 ล้างเวลาซิงค์เริ่มใหม่</button>
        </div>

        <!-- 5. ตั้งค่า -->
        <div id="content-settings" class="wb-content-padding">
            <h3 style="margin-top:0;">🖼️ ภาพพื้นหลัง (Wallpaper)</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                <button id="btnWallDefault" class="btn-secondary" style="flex: 1; font-size: 0.85em;">🌌 สีพื้นฐาน</button>
                <button id="btnWallCyber" class="btn-secondary" style="flex: 1; font-size: 0.85em;">🌆 ไซเบอร์พังก์</button>
                <button id="btnWallStar" class="btn-secondary" style="flex: 1; font-size: 0.85em;">⛰️ ภูเขาดวงดาว</button>
                <button id="btnWallNature" class="btn-secondary" style="flex: 1; font-size: 0.85em;">🏞️ ธรรมชาติ</button>
            </div>
            <input type="text" id="inputCustomWallpaper" placeholder="หรือวางลิงก์รูปภาพ (URL) ของคุณที่นี่..." style="margin-bottom: 15px;">
            
            <label>รูปแบบภาพพื้นหลัง:</label>
            <select id="bgSizeSelect" style="width:100%; padding:10px; margin-bottom:30px; background:#2c2c2e; color:white; border-radius:10px; border:none; outline:none;">
                <option value="cover">เต็มจอ (ภาพอาจถูกตัดขอบ)</option>
                <option value="contain">พอดีจอ (เห็นภาพครบ แต่อาจมีขอบดำ)</option>
            </select>
            
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 25px;">

            <h3 style="margin-top: 0;">🔀 โหมดเล่นเพลง</h3>
            <div style="margin-bottom: 25px;">
                <label class="lang-toggle" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="toggleShuffleBtn"> สุ่มเพลงอัตโนมัติเมื่อเล่นจบ
                </label>
            </div>
            
            <h3 style="margin-top:0;">🪟 ปรับแต่งหน้าต่าง WinBox</h3>
            <label>ความโปร่งใส (Opacity):</label>
            <input type="range" id="sliderOpacity" min="10" max="100" value="95" style="width:100%; margin-bottom:10px;">
            <label>ความเบลอ (Blur):</label>
            <input type="range" id="sliderBlur" min="0" max="50" value="20" style="width:100%; margin-bottom:25px;">
            
            <h3 style="margin-top:0;">📝 ขนาดตัวอักษรเนื้อเพลง</h3>
            <input type="range" id="sliderFontSize" min="0.8" max="2.5" step="0.1" value="1.15" style="width:100%; margin-bottom:30px;">
            
            <h3 style="margin-top: 0;">🈯️ แสดง/ซ่อนภาษา</h3>
            <div id="lyricLangToggles" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <label class="lang-toggle"><input type="checkbox" id="chkLang0" checked> 🇯🇵 ญี่ปุ่น</label>
                <label class="lang-toggle"><input type="checkbox" id="chkLang1" checked> 🔤 โรมาจิ</label>
                <label class="lang-toggle"><input type="checkbox" id="chkLang2" checked> 🇹🇭 ไทย</label>
            </div>
        </div>

        <!-- 6. เพิ่ม/แก้ไขเพลง -->
        <div id="content-add" class="wb-content-padding">
            <label>ชื่อเพลง:</label>
            <input type="text" id="inputTitle" placeholder="เช่น ソワレ (Soirée)">
            <label>ชื่อศิลปิน:</label>
            <input type="text" id="inputArtist" placeholder="เช่น [Suisei] [Miko]" list="artistList"> 
            <datalist id="artistList"></datalist>
            <label>ลิงก์ YouTube:</label>
            <input type="text" id="inputAudio" placeholder="วางลิงก์วิดีโอ YouTube ที่นี่">
            <label>เนื้อเพลง:</label>
            <textarea id="inputLyrics" placeholder="ท่อนที่ 1 ญี่ปุ่น&#10;ท่อนที่ 1 โรมาจิ&#10;ท่อนที่ 1 ไทย&#10;&#10;ท่อนที่ 2..."></textarea>
            
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0 10px 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <label style="margin: 0; color: #ffcc00; font-size: 0.9em;">🎧 เวอร์ชัน Cover (ถ้ามี)</label>
                <button id="btnAddCoverForm" class="btn-secondary" style="padding: 4px 10px; font-size: 0.8em; background: rgba(255, 204, 0, 0.2); color: #ffcc00; border: 1px solid rgba(255, 204, 0, 0.4);">➕ เพิ่ม Cover</button>
            </div>
            <div id="coverInputsContainer"></div>
            
            <button id="btnSave" class="btn-primary" style="width: 100%; margin-top: 15px;">💾 บันทึกเพลง</button>
        </div>
        
    </div>
    
    <!-- แถบสุ่มเพลงด้านขวา -->
    <div id="randomPlaylistPanel" class="right-panel open">
        <button id="btnToggleRandom" class="panel-toggle-btn">
            <span id="panelToggleIcon">▶</span>
        </button>
        <div class="panel-content">
            <h3 style="margin-top: 0; font-size: 1.1em; text-align: center; color: #00d2ff; margin-bottom: 15px;">
                🎲 5 เพลงสุ่มน่าฟัง
            </h3>
            <div id="randomSongList" class="random-song-list"></div>
            <button id="btnRenderRandom" class="btn-primary" style="width: 100%; margin-top: 15px; font-size: 0.9em;">
                🔄 สุ่มเพลงใหม่
            </button>
         </div>
    </div> 

    <!-- ปุ่มแจ้งเตือน -->
    <button id="btnDockNotify" class="floating-notify-btn" title="เพลงใหม่ล่าสุด">
        🔔<span id="notifyBadge" class="notify-badge" style="display: none;"></span>
    </button>

    <!-- 🔴 โหลด Module (ลบ script อื่นๆ ที่ผูกกับ window ออก) -->
    <script type="module" src="ui-binder.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
