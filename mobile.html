<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate JP Mix - Mobile</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ultimate JP Mix">
    <meta property="og:title" content="Ultimate JP Mix">
    <meta property="og:description" content="คลังเพลงญี่ปุ่น พร้อมเนื้อเพลงซิงค์และโรมาจิ — Ultimate JP Mix">
    <meta property="og:image" content="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=1200&h=630&fit=crop">
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <!-- 🔴 1. หน้าจอหลัก (Views) -->
    <div id="view-home" class="view active">
        <div class="top-bar">
            <h1>หน้าแรก</h1>
        </div>
        <div class="content-scroll">
            <div id="mobileArtistWidget" class="artist-card">
                <div style="text-align:center; color:#aaa; margin-top: 20px;">กำลังโหลดศิลปิน...</div>
            </div>
            
            <h2 class="section-title">✨ เพลงสุ่มน่าฟัง</h2>
            <div id="mobileRandomSongs" class="song-list"></div>
        </div>
    </div>

    <div id="view-library" class="view">
        <div class="top-bar">
            <h1>คลังเพลง</h1>
            <input type="text" id="mobileSearch" placeholder="🔍 ค้นหาเพลง หรือ ศิลปิน..." oninput="searchMobileSongs()">
        </div>
        <div class="content-scroll" style="padding-top: 110px;">
            <div id="mobileSongList" class="song-list"></div>
        </div>
    </div>

    <!-- 🔴 2. เครื่องเล่นเพลงขนาดย่อ (Mini Player) -->
    <div id="mini-player" class="hidden" onclick="toggleFullPlayer()">
        <img id="mini-thumb" src="">
        <div class="mini-info">
            <div id="mini-title" class="title">เลือกเพลง</div>
            <div id="mini-artist" class="artist">-</div>
        </div>
        <button id="mini-play-btn" class="play-btn" onclick="event.stopPropagation(); toggleMobilePlay()">⏸</button>
    </div>

    <!-- 🔴 3. แถบเมนูด้านล่าง (Bottom Navigation) -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <div class="nav-icon">🏠</div>
            <span>หน้าแรก</span>
        </div>
        <div class="nav-item" onclick="switchTab('library', this)">
            <div class="nav-icon">🎵</div>
            <span>คลังเพลง</span>
        </div>
    </nav>

    <!-- 🔴 4. เครื่องเล่นเพลงเต็มจอ (Full Screen Player) -->
    <div id="full-player" class="full-player">
        <div class="full-player-header">
            <button class="icon-btn" onclick="toggleFullPlayer()">🔽</button>
            <span style="font-size: 12px; color: #aaa; font-weight:bold; text-transform: uppercase;">กำลังเล่น</span>
            <button class="icon-btn" style="opacity: 0;">⋮</button>
        </div>
        
        <div class="album-art-container">
            <img id="full-thumb" class="album-art" src="">
        </div>
        
        <div class="song-details">
            <h2 id="full-title">Title</h2>
            <p id="full-artist">Artist</p>
        </div>
        
        <div class="player-controls">
            <button class="control-btn" onclick="prevMobileSong()">⏮</button>
            <button id="full-play-btn" class="control-btn main-play" onclick="toggleMobilePlay()">⏸</button>
            <button class="control-btn" onclick="nextMobileSong()">⏭</button>
        </div>

        <div class="mobile-quality-wrap">
            <button id="btnMobileQuality" class="mobile-quality-btn" onclick="toggleMobileQuality(event)" title="คุณภาพวิดีโอ">
                <i class="fa-solid fa-gear"></i><span id="btnMobileQualityLabel">Auto</span>
            </button>
            <div id="mobileQualityMenu" class="quality-menu mobile" style="display:none;">
                <div class="quality-menu-header">คุณภาพวิดีโอ</div>
                <div class="quality-menu-list" id="mobileQualityMenuList"></div>
            </div>
        </div>

        <div id="player-youtube" style="display:none;"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="mobile.js"></script>
    <script>
        // ระบบสลับแท็บง่ายๆ
        function switchTab(tabId, element) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + tabId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }
        
        function toggleFullPlayer() {
            const player = document.getElementById('full-player');
            player.classList.toggle('active');
        }
    </script>
</body>
</html>
